# Produktivbetrieb auf einem Root-Server: Caddy (HTTPS) + App + PostgreSQL.
# Wird von install.sh eingerichtet. Konfiguration in deploy/.env (siehe env.example).
name: drk-kfz

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: drk_kfz
      POSTGRES_USER: drk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD in deploy/.env setzen}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drk -d drk_kfz"]
      interval: 10s
      retries: 10

  app:
    build: ..
    image: drk-kfz-warte:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://drk:${POSTGRES_PASSWORD}@db:5432/drk_kfz?schema=public
      UPLOAD_DIR: /data/uploads
      DEMO_MODE: "false"
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN in deploy/.env setzen}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
